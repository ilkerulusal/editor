name: Publish image (fork)

# Builds the self-host Docker image on GitHub's runners and pushes it to this
# account's GitHub Container Registry. Runs on every push to the
# `santiye-deploy` branch, or by hand from the Actions tab.
on:
  push:
    branches: [santiye-deploy]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ilkerulusal/santiye-editor:latest
            ghcr.io/ilkerulusal/santiye-editor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
