name: Publish image (fork)

# Builds the self-host Docker image natively for amd64 and arm64 on GitHub's
# runners and pushes a multi-arch image to this account's GitHub Container
# Registry. Runs on every push to the `santiye-deploy` branch, or by hand from
# the Actions tab.
on:
  push:
    branches: [santiye-deploy]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ilkerulusal/santiye-editor

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/${{ matrix.arch }}
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        run: |
          set -euo pipefail
          for tag in latest ${{ github.sha }}; do
            docker buildx imagetools create -t "$IMAGE:$tag" \
              "$IMAGE:${{ github.sha }}-amd64" \
              "$IMAGE:${{ github.sha }}-arm64"
          done
          docker buildx imagetools inspect "$IMAGE:latest"
